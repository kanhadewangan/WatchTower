name: CI 

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Node setup
        uses: actions/setup-node@v2
        with:
          node-version: 14
      - name: Install dependencies
        run: |
          bun  install
      - name: Docker Login
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Backend And Push to Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest
      - name: Build Frontend And Push to Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest -f Dockerfile.frontend .
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
      - name: Notify on Failure
        if: failure()
        run: |
          echo "Build failed! Notifying team..."
      - name: Notification On Success 
        # replace with actual notification command, e.g., sending a message to Slack or email
        if: success()
        run: |
          echo "Build succeeded! Notifying team..."
        else:
          echo "Build failed! Notifying team..."

      

