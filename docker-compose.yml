version: "3.8"
services:
 
  db:
    image: postgres:15-alpine
    container_name: postgres_testing
    restart: always
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10        # ← more retries
      start_period: 10s  # ← grace period before healthcheck begins

  cache:
    image: redis:7-alpine
    container_name: redis_testing
    restart: always
    ports:
      - "6379:6379"
  app:
    env_file:
      - .env
    # image: kanhadewanagn/watch_back:latest
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: watch_back
    restart: always
    ports:
      - "3000:3000"
    depends_on:
        db: 
            condition: service_healthy
        cache:
            condition: service_started
    environment:
      DATABASE_URL: postgresql://testuser:testpassword@db:5432/testdb
      REDIS_URL: redis://cache:6379
    command: ./start.sh   

  # frontend:
  #   # image: kanhadewanagn/frontend:latest
  #   build: 
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #   container_name: frontend-watch
  #   restart: always
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - app

      
volumes:
  db_data:
   


