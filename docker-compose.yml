version: "3.8"
services:
 
  db:
    image: postgres:16-alpine
    container_name: watchtower_postgres
    restart: always
    environment:
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower
      POSTGRES_DB: watchtower
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchtower -d watchtower"]
      interval: 5s
      timeout: 5s
      retries: 10        # ← more retries
      start_period: 10s  # ← grace period before healthcheck begins

  mongo:
    image: mongo:7
    container_name: watchtower_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  cache:
    image: redis:7-alpine
    container_name: redis_testing
    restart: always
    ports:
      - "6379:6379"
