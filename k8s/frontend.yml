


apiVersion: apps/v1
kind: Deployment
metadata: 
  name: watch-frontend-deploy
  namespace: frontend
spec:
   replicas: 3
   selector:
      matchLabels:
          app: watch-frontend
          templates: prod
   template:
      metadata:
        labels:
          app: watch-frontend
          templates: prod
      spec:
        containers:
          - name: watch-frontend
            image: kanhadewanagn/frontend:latest
            ports:
              - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: watch-frontend-service
  namespace: frontend
spec:
  selector:
    app: watch-frontend
    templates: prod
  ports:
    - protocol: TCP
      port: 5173
      targetPort: 5173
  type: LoadBalancer